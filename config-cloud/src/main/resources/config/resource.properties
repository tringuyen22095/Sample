spring.application.name: resource
spring.lifecycle.timeout-per-shutdown-phase: 30s
spring.jackson.date-format: yyyy-MM-dd'T'HH:mm:ss.SSSZ
spring.jackson.property-naming-strategy: SNAKE_CASE
spring.main.allow-bean-definition-overriding: false
spring.flyway.locations: classpath:/db/migration
spring.flyway.schemas: PRIVATE_APP
spring.flyway.baselineOnMigrate: true
spring.flyway.enabled: true
spring.datasource.url: jdbc:postgresql://${POSTGRESQL_HOST:127.0.0.1}:5432/testing?createDatabaseIfNotExist=true&currentSchema=PRIVATE_APP
spring.datasource.username: postgres
spring.datasource.password: password
spring.datasource.hikari.auto-commit: false
spring.datasource.jpa.open-in-view: false
spring.datasource.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.datasource.properties.hibernate.show_sql: false
spring.datasource.properties.hibernate.format_sql: true
spring.datasource.properties.hibernate.jdbc.time_zone: UTC
spring.datasource.properties.hibernate.timezone.default_storage: NORMALIZE
spring.datasource.properties.hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
spring.datasource.properties.hibernate.id.new_generator_mappings: true
spring.datasource.properties.hibernate.connection.provider_disables_autocommit: true
spring.datasource.properties.hibernate.cache.use_second_level_cache: false
spring.datasource.properties.hibernate.cache.use_query_cache: false
spring.datasource.properties.hibernate.generate_statistics: false
spring.datasource.properties.hibernate.jdbc.batch_size: 25
spring.datasource.properties.hibernate.order_inserts: true
spring.datasource.properties.hibernate.order_updates: true
spring.datasource.properties.hibernate.query.fail_on_pagination_over_collection_fetch: true
spring.datasource.properties.hibernate.query.in_clause_parameter_padding: true
spring.datasource.hibernate.ddl-auto: none

server.port: 8001
server.servlet.encodingcharset: UTF-8
server.servlet.context-path: "/resource"
server.shutdown: graceful

eureka.client.serviceUrl.defaultZone: ${EUREKA_URI:http://127.0.0.1:8761/eureka}
eureka.instance.preferIpAddress: true

springdoc.swagger-ui.path: "/api-docs"
springdoc.swagger-ui.enabled: true
