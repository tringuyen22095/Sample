server:
  port: 8888

spring:
  profiles:
    active:
    - native
  application:
    name: management-config
  cloud:
    config:
      server:
        native:
          searchLocations: classpath:/config

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance: 
    instance-id: ${spring.application.name}