version: '3.7'
services:
  postgresql:
    image: docker.io/bitnami/postgresql:latest
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - POSTGRESQL_USERNAME=bn_keycloak
      - POSTGRESQL_DATABASE=bitnami_keycloak
    volumes:
      - 'postgresql_data:/bitnami/postgresql'
  keycloak:
    image: docker.io/bitnami/keycloak:latest
    ports:
      - "80:8080"
    environment:
      - KEYCLOAK_CREATE_ADMIN_USER=true
    depends_on:
      - postgresql
    volumes:
      - '/d/docker/keycloak/mynewtheme:/opt/bitnami/keycloak/themes/mynewtheme'
  jenkins:
    image: jenkins/jenkins:latest-jdk17
    container_name: jenkins
    ports:
      - "8081:8080"
    volumes:
      - '/d/docker/jenkins:/var/jenkins_home'
    networks:
      - network-private
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    networks:
      - network-private
    ports:
      - 1025:1025
      - 8025:8025
volumes:
  postgresql_data:
    driver: local
networks:
  network-private:
    name: network-private